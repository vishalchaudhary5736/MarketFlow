# Development overlay: hot reload instead of a compiled image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Each service builds the `development` stage and bind-mounts the host working
# tree, so `nest start --watch` rebuilds and restarts on every save. No image
# rebuild is needed for a code change.
#
# The two volume entries matter in this order:
#   .:/usr/src/app            host source shadows the image's copy
#   /usr/src/app/node_modules anonymous volume preserving the CONTAINER's
#                             node_modules, which holds Linux-native binaries
#                             (the Prisma engine, bcrypt). Without this second
#                             line the host's node_modules wins and the service
#                             crashes on a platform mismatch.

services:
  api-gateway:
    build:
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"

  auth-service:
    build:
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"

  cart-service:
