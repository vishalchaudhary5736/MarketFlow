services:
  api-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: api-gateway
    env_file: .env
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    networks:
      - ecommerce-net

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: .
      args:
        SERVICE_NAME: cart-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${CART_SERVICE_PORT}:${CART_SERVICE_PORT}"
    networks:
      - ecommerce-net

  catalog-service:
    build:
      context: .
      args:
        SERVICE_NAME: catalog-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${CATALOG_SERVICE_PORT}:${CATALOG_SERVICE_PORT}"
    networks:
      - ecommerce-net

  inventory-service:
    build:
      context: .
      args:
        SERVICE_NAME: inventory-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    networks:
      - ecommerce-net

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      args:
        SERVICE_NAME: order-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    networks:
      - ecommerce-net

  payment-service:
    build:
      context: .
      args:
        SERVICE_NAME: payment-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    networks:
      - ecommerce-net

  analytics-service:
    build:
      context: .
      args:
        SERVICE_NAME: analytics-service
    env_file: .env
    restart: unless-stopped
    ports:
      - "${ANALYTICS_SERVICE_PORT}:${ANALYTICS_SERVICE_PORT}"
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge
